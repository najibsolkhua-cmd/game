<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d3326">
  <title>Холдинг — бизнес-игра</title>
  <meta name="description" content="Карточная бизнес-игра: собирайте компании, торгуйте картами вслепую, берите кредиты, покупайте акции соперников. 1 на 1 или до 4 игроков.">
  <link rel="icon" href="assets/cards/sale.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

<!-- ===== Меню ===== -->
<section id="setup">
  <div class="setup-box">
    <div class="hero">
      <div class="hero-cards">
        <div class="card"><img src="assets/cards/back.svg" alt=""></div>
        <div class="card"><img src="assets/cards/chem-prod-3.svg" alt=""></div>
        <div class="card"><img src="assets/cards/event-boom.svg" alt=""></div>
        <div class="card"><img src="assets/cards/sale.svg" alt=""></div>
      </div>
      <h1>ХОЛДИНГ</h1>
      <p class="tag">Собирайте компании, торгуйте картами вслепую, берите кредиты, покупайте акции конкурентов и переживайте кризисы.</p>
    </div>

    <div class="panel">
      <div id="mode-pick" class="modes">
        <button class="mode-btn" data-mode="duel"><span class="ico">⚔️</span><div><b>1 на 1</b><span>Вы против бота · цель $60</span></div></button>
        <button class="mode-btn" data-mode="four"><span class="ico">🏢</span><div><b>Вчетвером</b><span>Вы и 3 бота · цель $50</span></div></button>
        <button class="mode-btn" data-mode="hotseat"><span class="ico">👥</span><div><b>За одним экраном</b><span>2–4 человека передают устройство по кругу</span></div></button>
        <button class="mode-btn" data-mode="custom"><span class="ico">⚙️</span><div><b>Свой состав</b><span>Люди и боты в любой комбинации</span></div></button>
      </div>

      <div id="custom" class="hidden">
        <div class="field"><label>Игроков:</label>
          <div class="seg" id="count-seg"><button data-n="2">2</button><button data-n="3">3</button><button data-n="4" class="on">4</button></div>
        </div>
        <div class="seats" id="seats"></div>
        <div class="field"><label>Цель, $:</label><input id="target" type="number" min="20" max="200" step="5" style="width:90px">
          <label style="margin-left:auto"><input type="checkbox" id="opt-events" checked> События рынка</label></div>
        <div class="btns" style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
          <button class="btn ghost" id="custom-back">Назад</button>
          <button class="btn primary big" id="custom-start">Начать игру</button>
        </div>
      </div>

      <div class="setup-links">
        <button class="btn small" data-open="rules">📖 Правила</button>
        <button class="btn small" data-open="cards">🃏 Все карты</button>
        <button class="btn small" data-open="settings">⚙️ Настройки</button>
      </div>
    </div>
  </div>
</section>

<!-- ===== Игра ===== -->
<section id="game" class="hidden">
  <header class="topbar">
    <span class="logo">ХОЛДИНГ</span>
    <span class="goal">Цель <b id="goal-v">$45</b> · Раунд <b id="round-v">1</b></span>
    <span class="spacer"></span>
    <button class="btn icon log-btn" id="log-btn" title="Журнал">📜</button>
    <button class="btn icon" data-open="settings" title="Настройки">⚙️</button>
    <button class="btn icon" data-open="rules" title="Правила">?</button>
    <button class="btn icon ghost" id="to-menu" title="Выйти в меню">✕</button>
  </header>

  <main class="board">
    <div class="opponents" id="opponents"></div>

    <div class="center">
      <div class="pile" title="Колода — перетащите в руку, чтобы купить карту"><div class="stack" id="deck" data-drag="deck"></div><div class="label" id="deck-label">Колода</div></div>
      <div class="pile" title="Сброс"><div class="stack" id="discard"></div><div class="label" id="discard-label">Сброс</div></div>
      <div class="pile" id="event-pile" title="Событие рынка этого раунда"><div class="stack" id="event"></div><div class="label">Событие</div></div>
      <div class="pile" title="Перетащите карту — аукцион вслепую"><div class="stack zone" id="auction" data-drop="auction"><span class="z-ico">🔨</span>Аукцион</div><div class="label">вслепую</div></div>
      <div class="pile" title="Перетащите карту — продать банку сразу. Нажмите — кредит"><div class="stack zone bank" id="bank" data-drop="bank"></div><div class="label" id="bank-label">кредит</div></div>
      <div class="status" id="status"></div>
    </div>

    <div class="me-bar" id="me-bar"></div>
    <div class="companies" id="companies"></div>
    <div class="hand-zone" id="hand-zone" data-drop="hand"><div class="hand" id="hand"></div></div>
  </main>

  <aside class="sidebar" id="sidebar">
    <div class="side-head"><h3>Журнал сделок</h3><button class="btn small ghost log-close" id="log-close">✕</button></div>
    <div class="log" id="log"></div>
  </aside>
</section>

<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<template id="rules-tpl">
  <div class="rules">
    <p><b>Холдинг</b> — карточная бизнес-игра на 2–4 игрока. Вы собираете компании из четырёх этапов, продаёте их и богатеете. <b>Рука скрыта</b> (соперникам видна только рубашка-купюра), <b>стол открыт</b>. Рука — для сильных карт: «Продажа», «Налоговая», «Юрист», «Акция», универсальные и <b>один</b> запасной этап.</p>

    <h3>Цель</h3>
    <p>Первым накопить <b>$60</b> (вдвоём), <b>$55</b> (втроём) или <b>$50</b> (вчетвером) — считаются деньги <b>за вычетом кредита</b>. <b>Победа — сразу</b>, как только цель набрана. Если сыграно 30 / 26 / 22 раунда — побеждает самый богатый.</p>

    <h3>Колода (62 карты)</h3>
    <ul>
      <li><span class="chip" style="background:#b10dc9"></span><b>Химия</b>, <span class="chip" style="background:#e46f0a"></span><b>Лес</b>, <span class="chip" style="background:#e00000"></span><b>Стройка</b> — по 12 этапов: <b>Сырьё → Производство → Склад → Транспорт</b>, каждый в трёх уровнях: обычный, <b>(+2)</b>, <b>(+3)</b>.</li>
      <li><b>Универсальные</b> ×6 — заменяют любой этап своей отрасли (не «Продажу»).</li>
      <li><b>Продажа</b> ×6 — продаёт собранную компанию.</li>
      <li><b>Налоговая</b> ×6 — проверяет <b>стол</b> игрока: одну выложенную карту заберите себе или отправьте в сброс. Пустой стол — штраф $3.</li>
      <li><b>Юрист</b> ×4 — срабатывает <b>автоматически</b>, если на вас натравили налоговую, и отменяет проверку.</li>
      <li><b>Акция</b> ×4 — вложите $3 в компанию соперника (от 2 этапов): деньги сразу получает владелец, а при продаже вам достаётся треть выплаты.</li>
    </ul>

    <h3>События рынка</h3>
    <p>В начале раунда открывается событие и действует весь раунд: <b>Кризис</b> (−$4), <b>Бум</b> (+$3), <b>Госзаказ</b> (отрасль +$5), <b>Санкции</b> (отрасль нельзя продать), <b>Налоговые каникулы</b> (налоговую играть нельзя; акции, аукционы и всё остальное — можно), <b>Инфляция</b> (банк продаёт по $4), <b>Льготный кредит</b>, <b>Стабильность</b>.</p>

    <h3>Подготовка</h3>
    <p>5 карт и $10 каждому. Компенсация очерёдности (подобрана симуляцией): вдвоём второй игрок +$2; втроём первый +$2; вчетвером первый +$2, третий и четвёртый +$1.</p>

    <h3>Ход (60 секунд по умолчанию)</h3>
    <ol>
      <li><b>Доход:</b> 1 карта из колоды бесплатно.</li>
      <li><b>Стройка и продажа (бесплатно):</b> этап — в компанию; «Продажа» — на собранную компанию. Нет «Продажи»? Кнопка <b>«⚡ Срочно»</b> на собранной компании продаёт её за 50% (тратит сделку).</li>
      <li><b>Банк (бесплатно):</b> кредит $10 → вернуть $13 через 3 хода. Не хватает — отдаёте всё, к остатку +$3 пени.</li>
      <li><b>До 2 сделок:</b>
        <ul>
          <li><b>Купить у банка в тёмную</b> — $3 (колоду — в руку).</li>
          <li><b>Продать банку сразу</b> — карта на 🏦, +$2 (пока тащите карту, на банке написано «Продать»).</li>
          <li><b>Аукцион вслепую</b> — карта на 🔨, можно с заявкой-блефом; закрытые ставки, нет ставок — банк платит $2.</li>
          <li><b>Предложить карту игроку</b>, <b>купить у игрока вслепую</b>, <b>Налоговая</b>, <b>Акция</b>.</li>
        </ul>
      </li>
      <li><b>Конец хода:</b> в руке может остаться <b>только 1 обычный этап</b> — остальные автоматически ложатся на стол (если улучшают компанию) или продаются банку по $1. Затем лимит руки — <b>6 карт</b>, лишнее — банку по $1.</li>
    </ol>
    <p>Время вышло — ход завершается автоматически (незаконченные диалоги закрываются).</p>

    <h3>Стоимость компании</h3>
    <p><b>$12</b> + бонусы этапов (+2/+3) + <b>$3 «Чистый бизнес»</b> (без универсальных) + <b>$3 «Связь отраслей»</b> + событие рынка.</p>
    <table>
      <tr><th>Продаёте</th><th>Нужно 2+ этапа поставщика</th><th>Почему</th></tr>
      <tr><td>🔴 Стройка</td><td>🟠 Лес</td><td>древесина</td></tr>
      <tr><td>🟠 Лес</td><td>🟣 Химия</td><td>лаки и пропитка</td></tr>
      <tr><td>🟣 Химия</td><td>🔴 Стройка</td><td>новые цеха</td></tr>
    </table>

    <h3>Управление</h3>
    <ul>
      <li>Всё — <b>перетаскиванием</b> (мышь или палец). Подходящие места подсвечиваются; если бросить «не туда», игра объяснит почему.</li>
      <li>Нажмите на карту — она увеличится, там же кнопки действий. Нажмите на заголовок компании — расшифровка цены.</li>
      <li>⚙️ Настройки: тема стола, таймер хода, скорость ботов.</li>
    </ul>
  </div>
</template>

<script src="js/cards.js?v=6"></script>
<script src="js/engine.js?v=6"></script>
<script src="js/ai.js?v=6"></script>
<script src="js/ui.js?v=6"></script>
</body>
</html>
