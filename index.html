<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d3326">
  <title>Холдинг — бизнес-игра</title>
  <meta name="description" content="Карточная бизнес-игра: собирайте компании, торгуйте картами вслепую, берите кредиты, покупайте акции соперников. 1 на 1 или до 4 игроков.">
  <link rel="icon" href="assets/cards/sale.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== Меню ===== -->
<section id="setup">
  <div class="setup-box">
    <div class="hero">
      <div class="hero-cards">
        <div class="card"><img src="assets/cards/back.svg" alt=""></div>
        <div class="card"><img src="assets/cards/chem-prod-3.svg" alt=""></div>
        <div class="card"><img src="assets/cards/event-boom.svg" alt=""></div>
        <div class="card"><img src="assets/cards/sale.svg" alt=""></div>
      </div>
      <h1>ХОЛДИНГ</h1>
      <p class="tag">Собирайте компании, торгуйте картами вслепую, берите кредиты, покупайте акции конкурентов и переживайте кризисы.</p>
    </div>

    <div class="panel">
      <div id="mode-pick" class="modes">
        <button class="mode-btn" data-mode="duel"><span class="ico">⚔️</span><div><b>1 на 1</b><span>Вы против бота · цель $45</span></div></button>
        <button class="mode-btn" data-mode="four"><span class="ico">🏢</span><div><b>Вчетвером</b><span>Вы и 3 бота · цель $35</span></div></button>
        <button class="mode-btn" data-mode="hotseat"><span class="ico">👥</span><div><b>За одним экраном</b><span>2–4 человека передают устройство по кругу</span></div></button>
        <button class="mode-btn" data-mode="custom"><span class="ico">⚙️</span><div><b>Свой состав</b><span>Люди и боты в любой комбинации</span></div></button>
      </div>

      <div id="custom" class="hidden">
        <div class="field"><label>Игроков:</label>
          <div class="seg" id="count-seg"><button data-n="2">2</button><button data-n="3">3</button><button data-n="4" class="on">4</button></div>
        </div>
        <div class="seats" id="seats"></div>
        <div class="field"><label>Цель, $:</label><input id="target" type="number" min="20" max="200" step="5" style="width:90px">
          <label style="margin-left:auto"><input type="checkbox" id="opt-events" checked> События рынка</label></div>
        <div class="btns" style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
          <button class="btn ghost" id="custom-back">Назад</button>
          <button class="btn primary big" id="custom-start">Начать игру</button>
        </div>
      </div>

      <div class="setup-links">
        <button class="btn small" data-open="rules">📖 Правила</button>
        <button class="btn small" data-open="cards">🃏 Все карты</button>
      </div>
    </div>
  </div>
</section>

<!-- ===== Игра ===== -->
<section id="game" class="hidden">
  <header class="topbar">
    <span class="logo">ХОЛДИНГ</span>
    <span class="goal">Цель <b id="goal-v">$45</b> · Раунд <b id="round-v">1</b></span>
    <span class="spacer"></span>
    <select id="speed" title="Скорость ботов">
      <option value="1.6">🐢 Медленно</option>
      <option value="1" selected>Боты: обычно</option>
      <option value="0.4">⚡ Быстро</option>
    </select>
    <button class="btn small log-btn" id="log-btn" title="Журнал">📜</button>
    <button class="btn small" data-open="rules" title="Правила">?</button>
    <button class="btn small ghost" id="to-menu" title="Меню">✕</button>
  </header>

  <main class="board">
    <div class="opponents" id="opponents"></div>

    <div class="center">
      <div class="pile" title="Колода — перетащите в руку, чтобы купить карту"><div class="stack" id="deck" data-drag="deck"></div><div class="label" id="deck-label">Колода</div></div>
      <div class="pile" title="Сброс"><div class="stack" id="discard"></div><div class="label" id="discard-label">Сброс</div></div>
      <div class="pile event-pile" title="Событие рынка этого раунда"><div class="stack" id="event"></div><div class="label">Событие</div></div>
      <div class="zone auction-zone" id="auction" data-drop="auction"><span class="z-ico">🔨</span><b>Аукцион</b><small>вслепую</small></div>
      <div class="zone bank-zone" id="bank"></div>
      <div class="status" id="status"></div>
    </div>

    <div class="me-bar" id="me-bar"></div>
    <div class="companies" id="companies"></div>
    <div class="hand-zone" id="hand-zone" data-drop="hand"><div class="hand" id="hand"></div></div>
  </main>

  <aside class="sidebar" id="sidebar">
    <div class="side-head"><h3>Журнал сделок</h3><button class="btn small ghost log-close" id="log-close">✕</button></div>
    <div class="log" id="log"></div>
  </aside>
</section>

<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<template id="rules-tpl">
  <div class="rules">
    <p><b>Холдинг</b> — карточная бизнес-игра на 2–4 игрока. Вы собираете компании из четырёх этапов, продаёте их и богатеете. Карты на руке видите только вы — соперникам видна лишь <b>рубашка-купюра</b>, поэтому торговля картами идёт <b>вслепую</b>. Выложенные на стол этапы видят все.</p>

    <h3>Цель</h3>
    <p>Первым накопить <b>$45</b> (вдвоём), <b>$40</b> (втроём) или <b>$35</b> (вчетвером). Считаются деньги <b>за вычетом кредита</b>. Победа засчитывается в конце вашего хода. Если колода закончилась окончательно — побеждает самый богатый.</p>

    <h3>Колода (62 карты)</h3>
    <ul>
      <li><span class="chip" style="background:#b10dc9"></span><b>Химия</b>, <span class="chip" style="background:#e46f0a"></span><b>Лес</b>, <span class="chip" style="background:#e00000"></span><b>Стройка</b> — по 12 карт этапов: <b>Сырьё → Производство → Склад → Транспорт</b>, каждый в трёх уровнях: обычный, <b>(+2)</b>, <b>(+3)</b>.</li>
      <li><b>Универсальные</b> ×6 — заменяют любой этап своей отрасли (не «Продажу»).</li>
      <li><b>Продажа</b> ×6 — продаёт собранную компанию.</li>
      <li><b>Налоговая</b> ×6 — проверяет <b>стол</b> игрока (не руку!): одну выложенную карту заберите себе или отправьте в сброс. Если на столе пусто — игрок платит штраф $3.</li>
      <li><b>Юрист</b> ×4 — играется в ответ на налоговую против вас и отменяет её.</li>
      <li><b>Акция</b> ×4 — вложите $3 в компанию соперника (от 2 этапов). Деньги сразу получает владелец, а при продаже компании вам достаётся треть выплаты.</li>
    </ul>

    <h3>События рынка</h3>
    <p>В начале каждого раунда открывается карта из отдельной колоды событий и действует весь раунд: <b>Кризис</b> (компании −$4), <b>Экономический бум</b> (+$3), <b>Госзаказ</b> (отрасль +$5), <b>Санкции</b> (отрасль нельзя продать), <b>Налоговые каникулы</b>, <b>Инфляция</b> (банк продаёт по $4), <b>Льготный кредит</b> (без процентов), <b>Стабильность</b>.</p>

    <h3>Ход игрока</h3>
    <ol>
      <li><b>Доход:</b> возьмите 1 карту из колоды бесплатно.</li>
      <li><b>Стройка (бесплатно):</b> перетащите этап в свою компанию. Если место занято — новая карта встаёт, старая возвращается в руку.</li>
      <li><b>Продажа (бесплатно):</b> перетащите «Продажу» на собранную компанию.</li>
      <li><b>Банк (бесплатно):</b> кредит $10, вернуть $13 через 3 хода (автоматически). Не хватает денег — внесёте сколько есть, а к долгу добавится пеня $3. Одновременно — один кредит, гасить можно досрочно.</li>
      <li><b>До 2 сделок:</b>
        <ul>
          <li><b>Купить у банка в тёмную</b> — перетащите колоду в руку ($3).</li>
          <li><b>Аукцион вслепую</b> — перетащите карту на молоток. Можно сделать <b>заявку</b> («Это Продажа!») — она может быть блефом. Соперники делают закрытые ставки, побеждает самая высокая. Нет ставок — банк платит $1.</li>
          <li><b>Предложить карту игроку</b> — перетащите карту на соперника, назовите цену и заявку.</li>
          <li><b>Купить у игрока в тёмную</b> — перетащите карты соперника в свою руку и назовите цену; если он согласен, вы вытягиваете любую карту по рубашке.</li>
          <li><b>Налоговая</b> — перетащите на соперника. <b>Акция</b> — перетащите на его компанию.</li>
        </ul>
      </li>
      <li><b>Лимит руки — 7 карт.</b> Лишние в конце хода уходят банку по $1.</li>
    </ol>

    <h3>Стоимость компании</h3>
    <p><b>$12</b> + бонусы этапов (+2/+3) + <b>$3 «Чистый бизнес»</b> (без универсальных) + <b>$3 «Связь отраслей»</b> + эффект события рынка.</p>
    <p><b>Связи отраслей:</b> если на вашем столе есть 2+ этапа отрасли-поставщика, компания дороже на $3:</p>
    <table>
      <tr><th>Продаёте</th><th>Нужен поставщик</th><th>Почему</th></tr>
      <tr><td>🔴 Стройка</td><td>🟠 Лес</td><td>древесина для стройки</td></tr>
      <tr><td>🟠 Лес</td><td>🟣 Химия</td><td>лаки и пропитка</td></tr>
      <tr><td>🟣 Химия</td><td>🔴 Стройка</td><td>новые цеха</td></tr>
    </table>

    <h3>Управление</h3>
    <ul>
      <li>Все действия — <b>перетаскиванием</b>: мышью или пальцем.</li>
      <li>Нажмите на карту, чтобы увеличить её (там же есть кнопки действий).</li>
    </ul>
  </div>
</template>

<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
